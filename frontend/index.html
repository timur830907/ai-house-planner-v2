<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI House Planner Pro v2.0</title>
    <style>
        :root { --bg-dark: #1e272e; --panel-bg: #2f3640; --accent: #44bd32; --text: #f5f6fa; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background: var(--bg-dark); color: var(--text); overflow: hidden; }
        .sidebar { width: 340px; background: var(--panel-bg); padding: 25px; display: flex; flex-direction: column; gap: 20px; box-shadow: 4px 0 15px rgba(0,0,0,0.3); z-index: 10; }
        .sidebar h2 { font-size: 18px; text-transform: uppercase; letter-spacing: 1px; color: #00d2d3; margin-bottom: 5px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 12px; font-weight: 600; color: #a4b0be; }
        .form-group input, .form-group select { padding: 10px; background: #353b48; border: 1px solid #718093; border-radius: 6px; color: #fff; font-size: 14px; }
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: #4cd137; }
        .btn-secondary { background: #718093; color: #fff; }
        .btn-secondary:hover { background: #8c7ae6; }
        #viewer-container { flex: 1; position: relative; }
        .view-controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 5; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div class="sidebar">
        <h2>BIM Architect v2.0</h2>
        <div class="form-group">
            <label>Ширина дома (м)</label>
            <input type="text" id="widthInput" value="12.0">
        </div>
        <div class="form-group">
            <label>Длина дома (м)</label>
            <input type="text" id="lengthInput" value="14.0">
        </div>
        <div class="form-group">
            <label>Вариант планировки</label>
            <select id="variantSelect" onchange="applySelectedVariant()">
                <option value="0">Вариант 1</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="handleGenerate()">Сгенерировать BIM-проект</button>
        <hr style="border-color: #57606f;">
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="exportFile('pdf')">PDF Отчет</button>
            <button class="btn btn-secondary" onclick="exportFile('dxf')">CAD (DXF)</button>
        </div>
    </div>

    <div id="viewer-container">
        <div class="view-controls">
            <button class="btn btn-secondary" onclick="toggleViewMode(false)">3D Перспектива</button>
            <button class="btn btn-secondary" onclick="toggleViewMode(true)">2D План (Сверху)</button>
        </div>
    </div>

    <script src="/js/3d_viewer.js"></script>
    <script>
        let generatedVariants = [];

        document.addEventListener("DOMContentLoaded", () => {
            if (typeof init3DViewer === "function") init3DViewer("viewer-container");
        });

        function parseNum(val) {
            return parseFloat(String(val).replace(',', '.')) || 10.0;
        }

        async function handleGenerate() {
            const width = parseNum(document.getElementById("widthInput").value);
            const length = parseNum(document.getElementById("lengthInput").value);

            generatedVariants = [];
            const select = document.getElementById("variantSelect");
            select.innerHTML = "";

            for (let i = 0; i < 5; i++) {
                try {
                    const res = await fetch("/api/v1/generate", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ building_width: width, building_length: length, rooms: { seed: i } })
                    });
                    const data = await res.json();
                    if (data.status === "success") {
                        generatedVariants.push(data.layout);
                        const opt = document.createElement("option");
                        opt.value = i;
                        opt.textContent = `Вариант ${i + 1}`;
                        select.appendChild(opt);
                    }
                } catch (e) { console.error(e); }
            }

            if (generatedVariants.length > 0) update3DLayout(generatedVariants[0]);
        }

        function applySelectedVariant() {
            const idx = parseInt(document.getElementById("variantSelect").value) || 0;
            if (generatedVariants[idx]) update3DLayout(generatedVariants[idx]);
        }

        async function exportFile(type) {
            const width = parseNum(document.getElementById("widthInput").value);
            const length = parseNum(document.getElementById("lengthInput").value);
            const response = await fetch(`/api/v1/export/${type}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ building_width: width, building_length: length })
            });
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `house_plan.${type}`;
            a.click();
        }
    </script>
</body>
</html>
