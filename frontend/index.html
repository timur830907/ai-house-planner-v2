<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIM Architect v2.0</title>
    <style>
        :root { --bg-dark: #1e272e; --panel-bg: #2f3640; --accent: #44bd32; --text: #f5f6fa; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { display: flex; height: 100vh; background: var(--bg-dark); color: var(--text); overflow: hidden; }
        .sidebar { width: 340px; background: var(--panel-bg); padding: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 10; box-shadow: 4px 0 15px rgba(0,0,0,0.3); }
        .sidebar h2 { font-size: 18px; color: #00d2d3; letter-spacing: 1px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 12px; color: #a4b0be; font-weight: 600; }
        .form-group input, .form-group select { padding: 9px; background: #353b48; border: 1px solid #718093; border-radius: 6px; color: #fff; font-size: 13px; }
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 11px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: #4cd137; }
        .btn-secondary { background: #718093; color: #fff; }
        .btn-secondary:hover { background: #8c7ae6; }
        #viewer-container { flex: 1; position: relative; }
        .view-controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 5; }
    </style>

    <!-- Правильный порядок загрузки библиотек 3D -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>
</head>
<body>
    <div class="sidebar">
        <h2>BIM ARCHITECT V2.0</h2>
        <div class="form-group">
            <label>Ширина дома (м)</label>
            <input type="text" id="widthInput" value="12.0">
        </div>
        <div class="form-group">
            <label>Длина дома (м)</label>
            <input type="text" id="lengthInput" value="14.0">
        </div>
        <div class="form-group">
            <label>Геометрия дома</label>
            <select id="shapeSelect">
                <option value="rectangle">Прямоугольник</option>
                <option value="L_shape">Г-образный</option>
                <option value="T_shape">Т-образный</option>
                <option value="triangle">Треугольник</option>
                <option value="rhombus">Ромб</option>
                <option value="trapezoid">Трапеция</option>
                <option value="circle">Круг</option>
                <option value="ellipse">Эллипс</option>
            </select>
        </div>
        <div class="form-group">
            <label>Вариант планировки (из 30)</label>
            <select id="variantSelect" onchange="applySelectedVariant()">
                <option value="0">Вариант 1</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="handleGenerate()">Сгенерировать 30 вариантов</button>
        <hr style="border-color: #57606f;">
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="exportPDF()">PDF Отчет</button>
            <button class="btn btn-secondary" onclick="exportDXF()">CAD (DXF)</button>
        </div>
    </div>

    <div id="viewer-container">
        <div class="view-controls">
            <button class="btn btn-secondary" onclick="toggleViewMode(false)">3D Перспектива</button>
            <button class="btn btn-secondary" onclick="toggleViewMode(true)">2D План (Сверху)</button>
        </div>
    </div>

    <script src="/js/3d_viewer.js"></script>
    <script>
        let generatedVariants = [];

        document.addEventListener("DOMContentLoaded", () => {
            if (typeof init3DViewer === "function") init3DViewer("viewer-container");
        });

        function parseNum(val) {
            return parseFloat(String(val).replace(',', '.')) || 10.0;
        }

        async function handleGenerate() {
            const width = parseNum(document.getElementById("widthInput").value);
            const length = parseNum(document.getElementById("lengthInput").value);
            const shape = document.getElementById("shapeSelect").value;

            generatedVariants = [];
            const select = document.getElementById("variantSelect");
            select.innerHTML = "";

            const promises = [];
            for (let i = 0; i < 30; i++) {
                promises.push(
                    fetch("/api/v1/generate", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            width: width,
                            length: length,
                            shape: shape,
                            seed: i
                        })
                    }).then(r => r.json()).catch(err => console.error(err))
                );
            }

            const results = await Promise.all(promises);
            results.forEach((data, i) => {
                if (data && (data.status === "success" || data.rooms || data.layout)) {
                    const layoutData = data.layout || data;
                    generatedVariants.push(layoutData);
                    const opt = document.createElement("option");
                    opt.value = generatedVariants.length - 1;
                    opt.textContent = `Вариант ${generatedVariants.length}`;
                    select.appendChild(opt);
                }
            });

            if (generatedVariants.length > 0) {
                if (typeof update3DLayout === "function") update3DLayout(generatedVariants[0]);
            }
        }

        function applySelectedVariant() {
            const idx = parseInt(document.getElementById("variantSelect").value) || 0;
            if (generatedVariants[idx]) {
                if (typeof update3DLayout === "function") update3DLayout(generatedVariants[idx]);
            }
        }

        async function exportPDF() {
            const width = parseNum(document.getElementById("widthInput").value);
            const length = parseNum(document.getElementById("lengthInput").value);
            const shape = document.getElementById("shapeSelect").value;

            const idx = parseInt(document.getElementById("variantSelect").value) || 0;
            
            // Формируем payload с гарантированным присутствием dimensions и shape
            const currentLayout = generatedVariants[idx] ? JSON.parse(JSON.stringify(generatedVariants[idx])) : {};
            
            if (!currentLayout.dimensions) {
                currentLayout.dimensions = { width: width, length: length };
            }
            if (!currentLayout.shape) {
                currentLayout.shape = shape;
            }

            try {
                const response = await fetch("/api/v1/export/pdf", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(currentLayout)
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    alert(`Ошибка сервера при создании PDF: ${errData.detail || response.statusText}`);
                    return;
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `House_Plan_${width}x${length}.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            } catch (err) {
                console.error("Ошибка при выгрузке PDF:", err);
                alert("Не удалось отправить запрос на экспорт PDF.");
            }
        }

        async function exportDXF() {
            const width = parseNum(document.getElementById("widthInput").value);
            const length = parseNum(document.getElementById("lengthInput").value);
            const shape = document.getElementById("shapeSelect").value;
            const idx = parseInt(document.getElementById("variantSelect").value) || 0;

            const currentLayout = generatedVariants[idx] ? JSON.parse(JSON.stringify(generatedVariants[idx])) : {
                dimensions: { width: width, length: length },
                shape: shape,
                rooms: {}
            };

            try {
                const response = await fetch("/api/v1/export/dxf", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(currentLayout)
                });

                if (!response.ok) {
                    alert("Ошибка при выгрузке DXF.");
                    return;
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `House_Plan_${width}x${length}.dxf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            } catch (err) {
                console.error("Ошибка экспорта DXF:", err);
            }
        }
    </script>
</body>
</html>
