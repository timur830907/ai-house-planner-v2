<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI House Planner v2.0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; color: #333; }
    header { background: #2c3e50; color: white; padding: 1rem 2rem; text-align: center; }
    .container { display: flex; height: calc(100vh - 60px); }
    .sidebar { width: 320px; background: #fff; padding: 20px; border-right: 1px solid #e0e0e0; overflow-y: auto; }
    .viewer-container { flex: 1; position: relative; background: #1e1e1e; }
    #canvas-container { width: 100%; height: 100%; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
    button:hover { background: #219150; }
  </style>
  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <header>
    <h1>AI House Planner v2.0</h1>
  </header>
  <div class="container">
    <div class="sidebar">
      <h3>Параметры дома</h3>
      <div class="form-group">
        <label>Ширина (м):</label>
        <input type="number" id="width" value="10" step="0.5">
      </div>
      <div class="form-group">
        <label>Длина (м):</label>
        <input type="number" id="length" value="12" step="0.5">
      </div>
      <button id="btn-generate">Сгенерировать планировку</button>
    </div>
    <div class="viewer-container">
      <div id="canvas-container"></div>
    </div>
  </div>

  <script src="/js/3d_viewer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Инициализация 3D сцены
      init3DViewer('canvas-container');

      document.getElementById('btn-generate').addEventListener('click', async () => {
        const width = parseFloat(document.getElementById('width').value);
        const length = parseFloat(document.getElementById('length').value);

        const payload = {
          building_width: width,
          building_length: length,
          floors: 1,
          rooms: {
            "Гостиная": { min_area: 20 },
            "Спальня": { min_area: 14 },
            "Кухня": { min_area: 12 },
            "Cанузел": { min_area: 6 }
          }
        };

        try {
          const response = await fetch('/api/v1/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await response.json();
          if (data.status === 'success') {
            update3DLayout(data.layout);
          }
        } catch (err) {
          console.error("Ошибка при генерации:", err);
        }
      });
    });
  </script>
</body>
</html>
