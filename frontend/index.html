<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI House Planner v2.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; background-color: #1a1a1a; color: #fff; }
        header { padding: 15px; background: #2c3e50; text-align: center; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 320px; padding: 20px; background: #ffffff; color: #333; display: flex; flex-direction: column; gap: 15px; }
        .sidebar label { font-weight: bold; font-size: 13px; }
        .sidebar input, .sidebar select { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-submit { padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; margin-top: 10px; }
        .btn-submit:hover { background: #27ae60; }
        #viewer-container { flex: 1; position: relative; background: #111; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <header>
        <h1>AI House Planner v2.0</h1>
    </header>
    <div class="main-container">
        <div class="sidebar">
            <h3>Параметры дома</h3>
            <div>
                <label>Ширина (м):</label>
                <input type="text" id="widthInput" value="12.5">
            </div>
            <div>
                <label>Длина (м):</label>
                <input type="text" id="lengthInput" value="14.5">
            </div>
            <div>
                <label>Геометрия дома:</label>
                <select id="shapeSelect">
                    <option value="rectangle">Прямоугольный</option>
                    <option value="L_shape">Г-образный</option>
                    <option value="triangle_cut">Срез / Терраса</option>
                </select>
            </div>
            <div>
                <label>Вариант планировки:</label>
                <select id="variantSelect" onchange="applySelectedVariant()">
                    <option value="0">Вариант 1 (Текущий)</option>
                </select>
            </div>
            <button class="btn-submit" onclick="handleGenerate()">Сгенерировать (10 вариантов)</button>
        </div>
        <div id="viewer-container"></div>
    </div>

    <script src="/js/3d_viewer.js"></script>
    <script>
        let generatedVariants = [];

        document.addEventListener("DOMContentLoaded", () => {
            if (typeof init3DViewer === "function") {
                init3DViewer("viewer-container");
            }
        });

        function parseNum(val) {
            if (typeof val === "string") val = val.replace(',', '.');
            return parseFloat(val) || 10.0;
        }

        async function handleGenerate() {
            const width = parseNum(document.getElementById("widthInput").value);
            const length = parseNum(document.getElementById("lengthInput").value);
            const shape = document.getElementById("shapeSelect").value;

            generatedVariants = [];
            const variantSelect = document.getElementById("variantSelect");
            variantSelect.innerHTML = "";

            // Запрашиваем 10 альтернативных планировок
            for (let i = 0; i < 10; i++) {
                try {
                    const response = await fetch("/api/v1/generate", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ 
                            building_width: width, 
                            building_length: length,
                            rooms: { shape_type: shape, seed: i }
                        })
                    });
                    const data = await response.json();
                    if (data.status === "success") {
                        generatedVariants.push(data.layout);
                        const opt = document.createElement("option");
                        opt.value = i;
                        opt.textContent = `Вариант ${i + 1}`;
                        variantSelect.appendChild(opt);
                    }
                } catch (err) {
                    console.error(err);
                }
            }

            if (generatedVariants.length > 0) {
                update3DLayout(generatedVariants[0]);
            }
        }

        function applySelectedVariant() {
            const idx = parseInt(document.getElementById("variantSelect").value) || 0;
            if (generatedVariants[idx]) {
                update3DLayout(generatedVariants[idx]);
            }
        }
    </script>
</body>
</html>
