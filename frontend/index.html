<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>AI House Planner v2</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f6f8; }
    .card { background: #fff; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .btn { padding: 10px 15px; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-weight: bold; margin-right: 5px; }
    .btn-blue { background: #007bff; }
    .btn-green { background: #28a745; }
    .btn-teal { background: #17a2b8; }
  </style>
</head>
<body>

  <div class="card">
    <h2>AI House Planner v2</h2>
    
    <label>Общая площадь (кв. м):</label><br>
    <input type="number" id="area" value="100" style="width: 100%; padding: 8px; margin: 8px 0;"><br><br>

    <label>Помещения:</label><br>
    <input type="checkbox" id="hall" checked> Прихожая
    <input type="checkbox" id="living" checked> Гостиная
    <input type="checkbox" id="kitchen" checked> Кухня
    <input type="checkbox" id="bath" checked> Ванная
    <input type="checkbox" id="bed1" checked> Спальня 1
    <br><br>

    <button class="btn btn-blue" onclick="generatePlan()">🚀 Сгенерировать</button>
    <button class="btn btn-green" onclick="exportPDF()">📄 Скачать PDF</button>
    <button class="btn btn-teal" onclick="exportDXF()">📐 Скачать DXF</button>

    <!-- Контейнер 3D просмотра -->
    <div id="viewer3d" style="width: 100%; height: 350px; background: #1a1a1a; border-radius: 8px; margin-top: 20px;"></div>
  </div>

  <!-- Подключение Three.js и скриптов -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/3d_viewer.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
