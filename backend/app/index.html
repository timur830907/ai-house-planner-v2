<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>AI House Planner v2 — 3D Viewer</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; background-color: #f4f6f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .checkbox-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn { padding: 10px 18px; border: none; cursor: pointer; border-radius: 4px; font-size: 15px; font-weight: bold; }
    .btn-primary { background-color: #007bff; color: white; }
    .btn-primary:hover { background-color: #0056b3; }
    .btn-export { background-color: #28a745; color: white; }
    .btn-dxf { background-color: #17a2b8; color: white; }
    .action-buttons { margin-top: 15px; display: flex; gap: 10px; }
    #statusMessage { font-weight: bold; margin: 15px 0; color: #333; }
    
    /* Окно 3D просмотра */
    #viewer3d { width: 100%; height: 400px; background: #222; border-radius: 8px; margin-top: 20px; display: none; }
  </style>
  <!-- Подключаем Three.js из CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div class="card">
    <h1>AI House Planner v2</h1>

    <div class="form-group">
      <label for="areaInput">Общая площадь (кв. м):</label>
      <input type="number" id="areaInput" value="100" min="20" max="500">
    </div>

    <div class="form-group">
      <label>Помещения:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="rooms" value="Прихожая" checked> Прихожая</label>
        <label><input type="checkbox" name="rooms" value="Гостиная" checked> Гостиная</label>
        <label><input type="checkbox" name="rooms" value="Кухня" checked> Кухня</label>
        <label><input type="checkbox" name="rooms" value="Ванная" checked> Ванная</label>
        <label><input type="checkbox" name="rooms" value="Спальня 1" checked> Спальня 1</label>
      </div>
    </div>

    <div class="action-buttons">
      <button class="btn btn-primary" onclick="generatePlans()">🚀 Сгенерировать</button>
      <button class="btn btn-export" onclick="downloadExport(0, 'pdf')">📄 Скачать PDF</button>
      <button class="btn btn-dxf" onclick="downloadExport(0, 'dxf')">📐 Скачать DXF</button>
    </div>

    <div id="statusMessage"></div>
    
    <!-- 3D Хост -->
    <div id="viewer3d"></div>
  </div>

  <div id="plansContainer"></div>

  <script src="js/3d_viewer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
